<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 日报 - 每天读懂人工智能</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --bg-card-hover: #1c2333;
    --border: #30363d;
    --text: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent-purple: #a371f7;
    --accent-green: #3fb950;
    --tag-bg: #1a2a3a;
    --tag-text: #79c0ff;
    --hot-high: #ff7b72;
    --hot-mid: #d29922;
    --hot-low: #3fb950;
    --tab-active: #1f6feb;
    --divider: #21262d;
    --width: 1200px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }


  /* ══════ Search Box ══════ */
  .search-wrap {
    max-width: var(--width);
    margin: 0 auto;
    padding: 8px 24px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 16px;
    transition: all 0.25s;
    gap: 8px;
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,0.1);
  }
  .search-box .sb-icon {
    font-size: 14px;
    opacity: 0.5;
    flex-shrink: 0;
  }
  .search-box input {
    flex: 1;
    border: none;
    background: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    padding: 6px 0;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box .sb-clear {
    display: none;
    background: var(--border);
    border: none;
    color: var(--text-secondary);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .search-box .sb-clear.visible { display: flex; align-items: center; justify-content: center; }
  .search-box .sb-clear:hover { background: var(--text-muted); color: #fff; }
  .search-highlight {
    background: rgba(255,215,0,0.25);
    border-radius: 2px;
    padding: 1px 0;
  }
  .search-no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }

  /* ══════ Ticker Bar ══════ */
  .ticker-bar {
    background: linear-gradient(90deg, #1a1f2e 0%, #162032 100%);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    height: 36px;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    flex-shrink: 0;
    background: var(--hot-high);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 0 4px 4px 0;
    margin-right: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    animation: pulse-label 2s ease-in-out infinite;
  }
  @keyframes pulse-label { 0%,100%{opacity:1} 50%{opacity:.7} }
  .ticker-track {
    display: flex;
    animation: ticker-scroll 60s linear infinite;
    white-space: nowrap;
  }
  .ticker-track:hover { animation-play-state: paused; }
  @keyframes ticker-scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 12px;
    padding: 0 20px;
    border-right: 1px solid var(--divider);
    cursor: pointer;
    transition: color 0.2s;
  }
  .ticker-item:hover { color: var(--accent); }
  .ticker-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .ticker-dot.hot { background: var(--hot-high); }
  .ticker-dot.new { background: var(--accent); }
  .ticker-dot.normal { background: var(--text-muted); }

  /* ══════ Header ══════ */
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 0 0;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(16px);
  }
  .header-inner {
    max-width: var(--width);
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .header-left {}
  .logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #58a6ff, #a371f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
    margin-bottom: 12px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 12px;
  }
  .refresh-info {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
  }
  .refresh-btn {
    padding: 6px 14px;
    background: #1f6feb20;
    color: var(--accent);
    border: 1px solid #1f6feb40;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .refresh-btn:hover { background: #1f6feb35; border-color: var(--accent); }
  .refresh-btn.spinning .rf-icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ══════ Tabs ══════ */
  .tabs {
    display: flex;
    gap: 0;
    max-width: var(--width);
    margin: 0 auto;
    padding: 0 24px;
  }
  .tab-btn {
    padding: 10px 24px;
    border: none;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 15px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    font-family: inherit;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--tab-active);
  }

  /* ══════ Container ══════ */
  .container {
    max-width: var(--width);
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ══════ Stats Bar ══════ */
  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .stats-bar .stat-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stats-bar .stat-val {
    color: var(--text);
    font-weight: 600;
  }

  /* ══════ Hero Section ══════ */
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .hero-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .hero-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #58a6ff, #a371f7);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hero-card:hover {
    background: var(--bg-card-hover);
    border-color: #3a4a60;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .hero-card:hover::before { opacity: 1; }
  .hero-card .hc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 10px;
  }
  .hero-card .hc-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
  }
  .hero-card .hc-title:hover { color: var(--accent); }
  .hero-card .hc-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .hero-card .hc-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  /* Hot badge large */
  .hot-badge-lg {
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    line-height: 1;
  }
  .hot-badge-lg.fire { background: #ff7b7218; color: var(--hot-high); animation: fire-pulse 1.5s ease-in-out infinite; }
  .hot-badge-lg.warm { background: #d2992218; color: var(--hot-mid); }
  .hot-badge-lg .hbl-label { font-size: 9px; font-weight: 500; opacity: 0.7; }
  @keyframes fire-pulse { 0%,100%{box-shadow: 0 0 0 0 #ff7b7240} 50%{box-shadow: 0 0 0 8px #ff7b7200} }

  /* ══════ News Grid ─═════ */
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--divider);
  }
  .news-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .news-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    transition: all 0.25s;
    cursor: pointer;
    position: relative;
    animation: fadeInUp 0.4s ease backwards;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .news-card:hover {
    background: var(--bg-card-hover);
    border-color: #3a4a60;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .news-card .nc-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .news-card .nc-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card:hover .nc-title { color: var(--accent); }
  .news-card .nc-summary {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.55;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card .nc-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  /* Hot badge small */
  .hot-badge-sm {
    flex-shrink: 0;
    min-width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    line-height: 1;
  }
  .hot-badge-sm.fire { background: #ff7b7218; color: var(--hot-high); }
  .hot-badge-sm.warm { background: #d2992218; color: var(--hot-mid); }
  .hot-badge-sm.cool { background: #3fb95018; color: var(--hot-low); }
  .hot-badge-sm .hbs-label { font-size: 7px; font-weight: 500; opacity: 0.6; }

  /* ══════ Tags & Sources ══════ */
  .tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
  }
  .source {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .source-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: inline-block;
  }
  .source-dot.tc { background: #3fb950; }
  .source-dot.hn { background: #ff7b72; }
  .source-dot.rd { background: #ffa657; }
  .source-dot.ar { background: #a371f7; }

  /* ══════ Learning Tab ══════ */
  .learning-block {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 24px;
  }
  .learning-block h2 {
    font-size: 19px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .learning-icon { font-size: 24px; }
  .learning-block .meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }
  .learning-block .body {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .learning-block .body p { margin-bottom: 12px; }
  .paper-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    padding: 8px 18px;
    background: #1f6feb20;
    color: var(--accent);
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .paper-link:hover { background: #1f6feb35; }

  /* ══════ Daily Tab (吃瓜日常) ══════ */
  .daily-hero {
    background: linear-gradient(135deg, #1a1028 0%, #0f1a2e 50%, #1a1028 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    margin-bottom: 20px;
    text-align: center;
  }
  .daily-hero h2 {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .daily-hero .dh-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .mood-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .mood-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .mood-chip:hover { border-color: #5a5a7a; color: var(--text); }
  .mood-chip.active {
    background: #1f6feb20;
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* masonry-like grid */
  .daily-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: auto;
    gap: 14px;
  }
  .daily-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    transition: all 0.25s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: fadeInUp 0.4s ease backwards;
  }
  .daily-card:nth-child(5n+1) { grid-row: span 1; }
  .daily-card:nth-child(5n+3) { grid-row: span 1; }
  .daily-card:hover {
    background: var(--bg-card-hover);
    border-color: #3a4a60;
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .daily-card .dc-cat {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .dc-cat.美食 { color: #ff6b6b; }
  .dc-cat.游戏 { color: #a371f7; }
  .dc-cat.科技生活 { color: #58a6ff; }
  .dc-cat.冷知识 { color: #3fb950; }
  .dc-cat.奇闻 { color: #d29922; }
  .dc-cat.趣图 { color: #ff7b72; }
  .dc-cat.生活 { color: #79c0ff; }
  .daily-card .dc-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 8px;
    flex: 1;
  }
  .daily-card:hover .dc-title { color: var(--accent); }
  .daily-card .dc-mood {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 20px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .daily-card:hover .dc-mood { opacity: 1; }
  .daily-card .dc-summary {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .daily-card .dc-meta {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    font-size: 11px;
    color: var(--text-muted);
  }
  .daily-spinner {
    display: inline-block;
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: #ff6b6b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }

  /* ══════ Loading ══════ */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .loading-skeleton {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .skeleton-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer {
    0% { opacity: 0.4; }
    50% { opacity: 0.7; }
    100% { opacity: 0.4; }
  }
  .skeleton-line {
    height: 14px;
    background: var(--border);
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .skeleton-line.w80 { width: 80%; }
  .skeleton-line.w50 { width: 50%; }
  .skeleton-line.w30 { width: 30%; }

  /* ══════ Footer ══════ */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--divider);
    max-width: var(--width);
    margin: 0 auto;
  }
  .footer a { color: var(--accent); text-decoration: none; }

  /* ══════ Toast ══════ */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1f6feb;
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ══════ Responsive ══════ */
  @media (max-width: 768px) {
    :root { --width: 100%; }
    .hero-grid { grid-template-columns: 1fr; }
    .news-grid { grid-template-columns: 1fr; }
    .loading-skeleton { grid-template-columns: 1fr; }
    .header-inner { flex-direction: column; align-items: flex-start; }
    .header-right { width: 100%; justify-content: flex-end; margin-top: -36px; }
    .logo { font-size: 24px; }
    .hero-card { padding: 18px; }
    .hero-card .hc-title { font-size: 16px; }
    .hot-badge-lg { width: 42px; height: 42px; font-size: 15px; }
  }

  @media (max-width: 480px) {
    .ticker-bar { height: 30px; }
    .ticker-label { font-size: 10px; padding: 3px 8px; }
    .tab-btn { padding: 8px 14px; font-size: 13px; }
    .news-card { padding: 14px; }
    .stats-bar { gap: 12px; font-size: 11px; }
  }
</style>
</head>
<body>

<!-- ══════ Ticker Bar ══════ -->
<div class="ticker-bar" id="tickerBar">
  <span class="ticker-label">📡 实时</span>
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<!-- ══════ Header ══════ -->
<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <div class="logo">🤖 AI 日报</div>
      <div class="subtitle">每天读懂人工智能</div>
    </div>

//  带超时 fetch
// ═══════════════════════════════════════════════
function fetchWithTimeout(url, timeout) {
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, timeout || FETCH_TIMEOUT);
  var sep = url.indexOf('?') >= 0 ? '&' : '?';
  var busted = url + sep + 'v=' + Date.now();
  return fetch(busted, { signal: ctrl.signal }).finally(function(){ clearTimeout(timer); });
}

// ═══════════════════════════════════════════════
//  格式化时间
// ═══════════════════════════════════════════════
function formatTime(s) {
  if (!s) return '';
  try {
    var d = new Date(s);
    if (isNaN(d.getTime())) return '';
    var diff = Date.now() - d.getTime();
    var min = Math.floor(diff / 60000);
    if (min < 1)  return '刚刚';
    if (min < 60) return min + ' 分钟前';
    var h = Math.floor(min / 60);
    if (h < 24) return h + ' 小时前';
    var days = Math.floor(h / 24);
    if (days < 30) return days + ' 天前';
    return d.toLocaleDateString('zh-CN');
  } catch(e) { return ''; }
}

// ═══════════════════════════════════════════════
//  HTML 工具
// ═══════════════════════════════════════════════
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function sourceDot(source) {
  var m = { TechCrunch:'tc', HackerNews:'hn', Reddit:'rd', ArXiv:'ar' };
  return m[source] || '';
}

function hotBadgeClass(score) {
  if (score >= 75) return 'fire';
  if (score >= 50) return 'warm';
  return 'cool';
}

function sourceHTML(sources) {
  return (sources || []).map(function(s) {
    return '<span class="source"><span class="source-dot ' + sourceDot(s) + '"></span>' + esc(s) + '</span>';
  }).join('');
}

function tagsHTML(tags) {
  return (tags || []).slice(0, 4).map(function(t) {
    return '<span class="tag">' + esc(t) + '</span>';
  }).join('');
}

//  渲染学习
// ═══════════════════════════════════════════════
function renderLearning(data, isDemo) {
  var container = document.getElementById('learningContent');
  if (!data || typeof data !== 'object') {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无内容</p></div>';
    return;
  }
  var termHTML = (data.term && data.term.word) ?
    '<div class="learning-block"><h2><span class="learning-icon">📖</span> 今日术语：' + esc(data.term.word) + '</h2>' +
    '<div class="body"><p>' + esc(data.term.explanation_cn || '') + '</p></div></div>' : '';
  var paperHTML = (data.paper && data.paper.title) ?
    '<div class="learning-block"><h2><span class="learning-icon">📄</span> 论文解读：' + esc(data.paper.title_cn || data.paper.title) + '</h2>' +
    '<div class="meta">原文：' + esc(data.paper.title) + ' · ' +
    (data.paper.authors ? '作者: ' + esc(data.paper.authors) + ' · ' : '') +
    (data.paper.published ? formatTime(data.paper.published) : '') + '</div>' +
    '<div class="body"><p>' + esc(data.paper.interpretation_cn || '') + '</p></div>' +
    (data.paper.link ? '<a class="paper-link" href="' + esc(data.paper.link) + '" target="_blank">📎 查看论文原文 →</a>' : '') +
    '</div>' : '';
  container.innerHTML = (termHTML + paperHTML) || '<div class="empty-state"><div class="icon">📭</div><p>暂无学习内容</p></div>';
}

// ═══════════════════════════════════════════════
//  自动刷新倒计时
// ═══════════════════════════════════════════════
function startRefreshTimer() {
  if (countdownInterval) clearInterval(countdownInterval);
  var remaining = AUTO_REFRESH_SEC;
  var info = document.getElementById('refreshInfo');
  function tick() {
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      showToast('🔄 自动刷新中...');
      loadData(true);
      return;
    }
    var m = Math.floor(remaining / 60);
    var s = remaining % 60;
    info.textContent = m + '分' + (s < 10 ? '0' : '') + s + '秒后刷新';
    remaining--;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ═══════════════════════════════════════════════
//  手动刷新
// ═══════════════════════════════════════════════
function refreshNow() {
  var btn = document.querySelector('.refresh-btn');
  btn.classList.add('spinning');
  loadData(false).finally(function() {
    setTimeout(function(){ btn.classList.remove('spinning'); }, 600);
  });
  showToast('🔄 正在刷新数据...');
}

// ═══════════════════════════════════════════════
const MOOD_EMOJI = { funny: '😂', amaze: '🤯', useful: '💡', hype: '🔥', nostalgia: '🥹', cute: '🥰' };

let allDailyItems = [];
let dailyFilter = 'all';

// ═══════════════════════════════════════════════
//  过滤日常
// ═══════════════════════════════════════════════
function filterDaily(mood) {
  dailyFilter = mood;
  document.querySelectorAll('#moodFilter .mood-chip').forEach(function(c) {
    var txt = c.textContent.trim();
    var emoji = MOOD_EMOJI[mood] || '';
    var match = mood === 'all' ? (txt.indexOf('全部') === 0) : (txt.indexOf(emoji) === 0);
    c.classList.toggle('active', match);
  });
  renderDailyCards(allDailyItems);
}

// ═══════════════════════════════════════════════
//  渲染日常卡片
// ═══════════════════════════════════════════════
function renderDailyCards(items) {
  var grid = document.getElementById('dailyGrid');
  if (!items || !items.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🍉</div><p>暂无吃瓜内容</p></div>';
    return;
  }
  var filtered = dailyFilter === 'all' ? items : items.filter(function(it) { return it.mood === dailyFilter; });
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>这个心情分类下没有内容，换个试试？</p></div>';
    return;
  }
  grid.innerHTML = filtered.map(function(n, i) {
    var moodEmoji = MOOD_EMOJI[n.mood] || '🍉';
    var tagsHTML = (n.tags || []).slice(0, 3).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    return '<article class="daily-card" style="animation-delay:' + (i*0.04) + 's;cursor:pointer" data-link="' + esc(n.link) + '">' +
      '<span class="dc-mood">' + moodEmoji + '</span>' +
      '<span class="dc-cat ' + esc(n.category) + '">' + esc(n.category) + '</span>' +
      '<div class="dc-title">' + esc(n.title_cn) + '</div>' +
      '<div class="dc-summary">' + esc(n.summary_cn || '') + '</div>' +
      '<div class="dc-meta">' + tagsHTML +
        '<span style="margin-left:auto">' + formatTime(n.published) + '</span>' +
      '</div></article>';
  }).join('');

  var subtitle = document.getElementById('dailySubtitle');
  if (subtitle) {
    var cats = [];
    items.forEach(function(it) { if (cats.indexOf(it.category) < 0) cats.push(it.category); });
    subtitle.textContent = (dailyFilter === 'all' ? '' : MOOD_EMOJI[dailyFilter] + ' ') +
      filtered.length + ' 条内容 · ' + cats.slice(0, 6).join(' · ');
  }
}

// Global card click handler - replaces onclick+window.open to avoid popup blockers
document.addEventListener("click", function(e) {
  var card = e.target.closest("[data-link]");
  if (card) {
    var link = card.getAttribute("data-link");
    if (link && link.trim() && link !== "#") {
      window.open(link, "_blank");
    }
  }
});

async function loadData(silent) {
  if (!silent) {
    document.getElementById('heroArea').innerHTML =
      '<div class="loading-skeleton"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line w30"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div><div class="skeleton-line w30"></div></div></div>';
    document.getElementById('newsGridArea').innerHTML =
      '<div class="loading-skeleton"><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div></div><div class="skeleton-card"><div class="skeleton-line w80"></div><div class="skeleton-line w50"></div></div></div>';
  }

  var newsOk = false;
  var learnOk = false;

  // ── 加载新闻 ──
  try {
    var resp = await fetchWithTimeout(HOT_JSON);
    if (!resp.ok) resp = await fetchWithTimeout(NEWS_JSON);
    if (resp.ok) {
      var data = await resp.json();
      var newsArr = data.news || [];
      allNews = newsArr;
      isUsingDemo = false;
      renderAll(newsArr, data.updated, false);
      newsOk = true;
    }
  } catch(e) { console.log('fetch 新闻失败: ' + e.message); }

  if (!newsOk) {
    allNews = DEMO_HOT.news;
    isUsingDemo = true;
    renderAll(DEMO_HOT.news, null, true);
  }

  // ── 加载学习 ──
  try {
    var lr = await fetchWithTimeout(LEARNING_JSON);
    if (lr.ok) {
      var ld = await lr.json();
      renderLearning(ld, false);
      learnOk = true;
    }
  } catch(e) { console.log('fetch 学习失败: ' + e.message); }

  if (!learnOk) {
    renderLearning(DEMO_LEARN, true);
  }

  startRefreshTimer();
  loadDailyData();
  if (!silent) {
    showToast(newsOk ? '✅ 数据已更新' : '⚠️ 使用演示数据');
  }
}

// ═══════════════════════════════════════════════
//  统一渲染
// ═══════════════════════════════════════════════
function renderAll(newsArr, updated, isDemo) {
  // updateTime span removed - using refreshInfo instead，用 refreshInfo
  var info = document.getElementById('refreshInfo');
  if (updated) {
    info.setAttribute('data-updated', updated);
  }

  // 按热度排序
  var sorted = newsArr.slice().sort(function(a, b) { return (b.hot_score || 0) - (a.hot_score || 0); });

  // 前三作为 hero
  var heroNews = sorted.slice(0, 3);
  var restNews = sorted.slice(3);

  renderStats(sorted, updated, isDemo);
  renderTicker(sorted);
  renderHero(heroNews);
  renderNewsGrid(restNews);
}
