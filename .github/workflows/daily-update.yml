name: Daily AI News Update
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openai
      - name: Generate all content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python gen_real.py
          python gen_real_daily.py
          python gen_learning.py
      - name: Push changes
        run: |
          git config user.name "AI Bot"
          git config user.email "bot@ai.local"
          git add news.json hot_news.json daily.json learning.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update $(date -u +%Y-%m-%d)"
            git push
          fi
